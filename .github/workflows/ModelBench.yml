name: ModelBench

on:
  workflow_dispatch:
  push:
    paths: ['Tools/ModelBench/**']

permissions:
  contents: read

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch runner engine (llama.cpp prebuilt win-cpu-x64)
        shell: pwsh
        run: |
          $rels = Invoke-RestMethod -Uri 'https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=10'
          $rel = $rels | Where-Object { $_.tag_name -match '^b\d+$' } | Select-Object -First 1
          $asset = $rel.assets | Where-Object { $_.name -match '^llama-.*-bin-win-cpu-x64\.zip$' } | Select-Object -First 1
          Write-Host "Using $($rel.tag_name) / $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llama-bench-bin.zip
          Expand-Archive -Path llama-bench-bin.zip -DestinationPath llama-bench-bin
          Get-ChildItem llama-bench-bin | Select-Object -First 5

      - name: Fetch candidate models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $q = 'https://huggingface.co/bartowski/Qwen_Qwen3-1.7B-GGUF/resolve/main/Qwen_Qwen3-1.7B-Q4_K_M.gguf'
          $d = 'https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf'
          Invoke-WebRequest -Uri $q -OutFile models/Qwen3-1.7B-Q4_K_M.gguf
          Invoke-WebRequest -Uri $d -OutFile models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf
          Get-ChildItem models | Format-Table Name, Length

      - name: Standardized speed (llama-bench)
        shell: bash
        run: |
          mkdir -p Tools/ModelBench/out
          ./llama-bench-bin/llama-bench.exe -m models/Qwen3-1.7B-Q4_K_M.gguf -t 4 -r 3 -p 128 -n 128 > Tools/ModelBench/out/bench_qwen17b.txt 2>&1 || true
          ./llama-bench-bin/llama-bench.exe -m models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf -t 4 -r 3 -p 128 -n 128 > Tools/ModelBench/out/bench_r115b.txt 2>&1 || true
          cat Tools/ModelBench/out/bench_qwen17b.txt Tools/ModelBench/out/bench_r115b.txt

      - name: Realistic QA fallback (per-question)
        shell: bash
        run: |
          bash Tools/ModelBench/run-cloud.sh models/Qwen3-1.7B-Q4_K_M.gguf qwen17b 512
          bash Tools/ModelBench/run-cloud.sh models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf dsr15b 768
          cat Tools/ModelBench/out/run.log

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## ModelBench (windows-latest 4vCPU/16GB)"
            echo '### llama-bench'
            echo '```'
            cat Tools/ModelBench/out/bench_qwen17b.txt 2>/dev/null
            cat Tools/ModelBench/out/bench_r115b.txt 2>/dev/null
            echo '```'
            echo '### per-question wall time'
            echo '```'
            cat Tools/ModelBench/out/run.log 2>/dev/null
            echo '```'
            for f in Tools/ModelBench/out/qwen17b_*.out Tools/ModelBench/out/dsr15b_*.out; do
              echo "### $f"
              echo '```'
              tail -c 2500 "$f" 2>/dev/null
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-bench-results
          path: Tools/ModelBench/out/
