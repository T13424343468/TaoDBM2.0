name: ModelBench

on:
  workflow_dispatch:
  push:
    paths: ['Tools/ModelBench/**', '!Tools/ModelBench/results/**']

permissions:
  contents: write

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 360
    # MATRIX x3 (2026-11-22, boss order "1"): kernel-class census showed the
    # comparability key is the runner CPU kernel class (zen4/icelake vs haswell
    # vs sapphirerapids), and sapphirerapids appears at ~1/7 per throw. Three
    # parallel shards triple the sampling rate (expected C-class hits 0.43/throw).
    # First matrix throw re-opens the baseline series.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch runner engine (llama.cpp prebuilt win-cpu-x64)
        shell: pwsh
        run: |
          # PINNED 2026-11-20: build 12559 / commit 7e960f40f (matches B1 account 537e4f61).
          # Locked-build acceptance (99% requires two consecutive rounds on the SAME build) demands a fixed engine.
          # Do NOT bump this tag without a fresh baseline round.
          $tag = 'b12559'
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/$tag"
          $asset = $rel.assets | Where-Object { $_.name -match '^llama-.*-bin-win-cpu-x64\.zip$' } | Select-Object -First 1
          Write-Host "Using $($rel.tag_name) / $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llama-bench-bin.zip
          Expand-Archive -Path llama-bench-bin.zip -DestinationPath llama-bench-bin
          Get-ChildItem llama-bench-bin | Select-Object -First 5

      - name: Fetch candidate models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $q = 'https://huggingface.co/bartowski/Qwen_Qwen3-1.7B-GGUF/resolve/main/Qwen_Qwen3-1.7B-Q4_K_M.gguf'
          $d = 'https://huggingface.co/bartowski/DeepSeek-R1-Distill-Qwen-1.5B-GGUF/resolve/main/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf'
          Invoke-WebRequest -Uri $q -OutFile models/Qwen3-1.7B-Q4_K_M.gguf
          Invoke-WebRequest -Uri $d -OutFile models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf
          Get-ChildItem models | Format-Table Name, Length

      - name: Standardized speed (llama-bench)
        shell: bash
        run: |
          mkdir -p Tools/ModelBench/out
          ./llama-bench-bin/llama-bench.exe -m models/Qwen3-1.7B-Q4_K_M.gguf -t 4 -r 3 -p 128 -n 128 > Tools/ModelBench/out/bench_qwen17b.txt 2>&1 || true
          ./llama-bench-bin/llama-bench.exe -m models/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf -t 4 -r 3 -p 128 -n 128 > Tools/ModelBench/out/bench_r115b.txt 2>&1 || true
          cat Tools/ModelBench/out/bench_qwen17b.txt Tools/ModelBench/out/bench_r115b.txt

      - name: Realistic QA fallback (per-question, parallel feeding)
        shell: bash
        run: |
          env NOTHINK=1 bash Tools/ModelBench/run-cloud-parallel.sh models/Qwen3-1.7B-Q4_K_M.gguf qwen17b 700 4
          cat Tools/ModelBench/out/run.log

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## ModelBench shard ${{ matrix.shard }} (windows-latest 4vCPU/16GB)"
            echo '### llama-bench'
            echo '```'
            cat Tools/ModelBench/out/bench_qwen17b.txt 2>/dev/null
            cat Tools/ModelBench/out/bench_r115b.txt 2>/dev/null
            echo '```'
            echo '### per-question wall time'
            echo '```'
            cat Tools/ModelBench/out/run.log 2>/dev/null
            echo '```'
            for f in Tools/ModelBench/out/qwen17b_*.out Tools/ModelBench/out/dsr15b_*.out; do
              echo "### $f"
              echo '```'
              tail -c 2500 "$f" 2>/dev/null
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results to public branch (per-shard)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p publish && cp -r Tools/ModelBench/out publish/ 2>/dev/null || true
          cd publish
          git init -q
          git checkout -q -b model-bench-shard${{ matrix.shard }}
          git add -A
          git -c user.name=model-bench-bot -c user.email=actions@users.noreply.github.com commit -qm "ModelBench shard ${{ matrix.shard }} results $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" model-bench-shard${{ matrix.shard }}

      - name: Commit results to main
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          git config user.name "model-bench-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "Tools/ModelBench/results/shard${{ matrix.shard }}"
            cp Tools/ModelBench/out/run.log "Tools/ModelBench/results/shard${{ matrix.shard }}/run-$(date -u +%Y%m%d-%H%M%S).log" || true
            cp Tools/ModelBench/out/bench_*.txt "Tools/ModelBench/results/shard${{ matrix.shard }}/" 2>/dev/null || true
            cp Tools/ModelBench/out/*_q*.out "Tools/ModelBench/results/shard${{ matrix.shard }}/" 2>/dev/null || true
            git add Tools/ModelBench/results
            git commit -qm "bench: shard${{ matrix.shard }} results $(date -u +%Y-%m-%dT%H%M%SZ)"
            if git push origin HEAD:main; then break; fi
            echo "push attempt $attempt failed, retrying after backoff"
            sleep $((attempt * 20))
          done
      - name: Upload raw outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-bench-results-shard${{ matrix.shard }}
          path: Tools/ModelBench/out/

  aggregate:
    # Merged view for the monitor line: all shards land on model-bench-latest
    # under out/shard<N>/ so existing watchers keep a single branch to poll.
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: model-bench-results-shard*
          path: artifacts
      - name: Merge shards and publish to model-bench-latest
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p publish
          for d in artifacts/model-bench-results-shard*; do
            s=$(basename "$d" | sed 's/model-bench-results-shard//')
            mkdir -p "publish/out/shard$s"
            cp -r "$d"/* "publish/out/shard$s/" 2>/dev/null || true
          done
          cd publish
          git init -q
          git checkout -q -b model-bench-latest
          git add -A
          git -c user.name=model-bench-bot -c user.email=actions@users.noreply.github.com commit -qm "ModelBench matrix results $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" model-bench-latest
