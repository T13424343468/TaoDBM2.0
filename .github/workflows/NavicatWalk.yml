# NavicatWalk.yml — 竞品对照线 v3（2026-11-25 老板令：Premium 正牌有免费体验期不需要注册，Lite 换 Premium）
# 云真机真下载真静默安装真启动 Navicat Premium 简体中文版（试用版），ffmpeg 桌面全程录屏回传
# 第一轮被动录屏：启动等 60s 看弹什么，不点击；确认试用期弹窗再决定点哪
# 视频回传分支：navicat-shots-latest（与取证同款通道）
name: navicat-walk

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/NavicatWalk.yml'
      - 'Scripts/navicat-walk.ps1'

jobs:
  navicat:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Navicat Premium (CN, x64, trial)
        shell: pwsh
        run: |
          $url = "https://download.navicat.com/download/navicat18_premium_cs_x64.exe"
          $out = "$PWD\navicat-setup.exe"
          Write-Host "[DL] $url"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $len = (Get-Item $out).Length
          Write-Host "[DL] size=$len"
          if ($len -lt 100MB) { Write-Host "::error::installer too small"; exit 1 }

      - name: Download ffmpeg (static build)
        shell: pwsh
        run: |
          $zip = "$PWD\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$PWD\ff" -Force
          $ff = Get-ChildItem "$PWD\ff" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ff.FullName "$PWD\ffmpeg.exe"
          Write-Host "[FFMPEG] $((Get-Item "$PWD\ffmpeg.exe").Length) bytes"

      - name: Silent install (Inno Setup)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\navicat-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR="C:\Navicat"' -Wait -PassThru
          Write-Host "[INSTALL] exit=$($p.ExitCode)"
          $exe = Get-ChildItem "C:\Navicat","C:\Program Files\PremiumSoft" -Recurse -Filter "navicat.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::navicat.exe not found after install"; Get-ChildItem "C:\Navicat","C:\Program Files\PremiumSoft" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 | Out-Host; exit 1 }
          Write-Host "[FOUND] $($exe.FullName)"
          "NavicatExe=$($exe.FullName)" | Out-File -FilePath navicat-env.txt -Encoding utf8

      - name: Record screen while launching and walking
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # v8：v6/v7 实锤 ExePath 经 env 文件交接后传空，Navicat 从未启动；改为直接重找 exe 并落诊断日志
          "env-exists=$(Test-Path navicat-env.txt)" | Out-File walk-log.txt -Append -Encoding utf8
          if (Test-Path navicat-env.txt) { Get-Content navicat-env.txt | Out-File walk-log.txt -Append -Encoding utf8 }
          $found = Get-ChildItem "C:\Navicat","C:\Program Files\PremiumSoft" -Recurse -Filter "navicat.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { Write-Host "::error::navicat.exe not found in record step"; exit 1 }
          $exe = $found.FullName
          "exe=[$exe]" | Out-File walk-log.txt -Append -Encoding utf8
          # 录屏：整桌面 10fps，最长 9 分钟保险
          $ff = Start-Process -FilePath "$PWD\ffmpeg.exe" -ArgumentList '-y','-f','gdigrab','-framerate','10','-i','desktop','-c:v','libx264','-preset','veryfast','-crf','28','-pix_fmt','yuv420p','-g','20','-movflags','+frag_keyframe+empty_moov','-t','540','nav-walk.mp4' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          pwsh -NoProfile -File Scripts/navicat-walk.ps1 -ExePath $exe
          Start-Sleep -Seconds 5
          Stop-Process -Id $ff.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if (Test-Path nav-walk.mp4) { Write-Host "[VIDEO] $((Get-Item nav-walk.mp4).Length) bytes" } else { Write-Host "::error::video missing"; exit 1 }
          exit 0

      - name: Push video to public branch
        if: always()
        shell: pwsh
        run: |
          git config --global user.email "ci@taodbm.local"
          git config --global user.name "TaoDBM CI"
          New-Item -ItemType Directory -Force nav-repo | Out-Null
          Set-Location nav-repo
          git init | Out-Null
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin navicat-shots-latest 2>$null
          if ($LASTEXITCODE -eq 0) { git checkout -B navicat-shots-latest FETCH_HEAD 2>$null | Out-Null } else { git checkout --orphan navicat-shots-latest 2>$null | Out-Null; git rm -rf . 2>$null | Out-Null }
          if (Test-Path ..\nav-walk.mp4) { Copy-Item ..\nav-walk.mp4 -Force; git add nav-walk.mp4 }
          if (Test-Path ..\walk-log.txt) { Copy-Item ..\walk-log.txt -Force; git add walk-log.txt }
          git commit --allow-empty -m "navicat walk video run ${{ github.run_id }}" | Out-Null
          git push origin navicat-shots-latest --force 2>&1 | Out-Host
          Write-Host "[PUSHED] raw: https://raw.githubusercontent.com/${{ github.repository }}/navicat-shots-latest/nav-walk.mp4"

      - name: Upload video (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navicat-video
          path: nav-walk.mp4
